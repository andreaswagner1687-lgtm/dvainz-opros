<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Опросный лист на проектирование</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #eef1f3;
  --surface: #ffffff;
  --surface-2: #f7f9fa;
  --ink: #16202a;
  --muted: #5d6b77;
  --line: #d5dce1;
  --line-strong: #b9c4cb;
  --accent: #b4472c;
  --accent-ink: #ffffff;
  --accent-wash: #f6e9e5;
  --done: #2e7d5b;
  --shadow: 0 1px 2px rgba(22, 32, 42, .06), 0 6px 20px rgba(22, 32, 42, .05);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #10161b;
    --surface: #192128;
    --surface-2: #141c22;
    --ink: #e7eef3;
    --muted: #93a3ae;
    --line: #2b373f;
    --line-strong: #3d4c56;
    --accent: #d9694a;
    --accent-ink: #14191d;
    --accent-wash: #2a1d19;
    --done: #4fa584;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .3);
  }
}
:root[data-theme="dark"] {
  --ground: #10161b;
  --surface: #192128;
  --surface-2: #141c22;
  --ink: #e7eef3;
  --muted: #93a3ae;
  --line: #2b373f;
  --line-strong: #3d4c56;
  --accent: #d9694a;
  --accent-ink: #14191d;
  --accent-wash: #2a1d19;
  --done: #4fa584;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .3);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: "Golos Text", "Segoe UI", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  /* Двойное нажатие по варианту на телефоне браузер понимал как
     «приблизить», и страница прыгала в масштабе. manipulation
     оставляет прокрутку и щипок, но убирает зум по двойному тапу. */
  touch-action: manipulation;
}

.wrap {
  max-width: 660px;
  margin: 0 auto;
  padding: 0 16px 140px;
}

.eyebrow {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ─── Шапка ─── */
.head {
  padding: 28px 0 20px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 24px;
}
.head h1 {
  font-size: clamp(1.5rem, 1.2rem + 1.6vw, 2rem);
  font-weight: 800;
  letter-spacing: -.015em;
  line-height: 1.15;
  margin: 8px 0 10px;
  text-wrap: balance;
}
.head p { margin: 0; color: var(--muted); max-width: 52ch; }

/* ─── Плитки систем ─── */
.tiles { display: flex; flex-direction: column; gap: 10px; }

.tile {
  display: block;
  width: 100%;
  text-align: left;
  font: inherit;
  color: inherit;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.tile-main {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 16px;
  background: none;
  border: 0;
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
}
/* Квадрат под галочку с плитки убран 2026-08-27: нажатие на плитку
   сразу открывает вопросы, отдельного «отметить» нет, и галочка
   обещала выбор, которого не существует. Что система взята в работу,
   видно по счётчику «6 из 9» и по кнопке «убрать». */
.tile-icon {
  flex: 0 0 40px;
  height: 40px;
  color: var(--accent);
  display: grid;
  place-items: center;
}
.tile-icon svg, .tile-icon img { width: 40px; height: 40px; display: block; }
.tile-icon img { border-radius: 6px; object-fit: cover; }
.tile-name { flex: 1; font-weight: 600; letter-spacing: -.01em; }
.tile-count {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.tile[data-on="1"] { border-color: var(--line-strong); }
.tile { position: relative; }
.tile-drop {
  position: absolute;
  top: 0;
  right: 0;
  width: 34px;
  height: 34px;
  border: 0;
  background: none;
  color: var(--muted);
  font: inherit;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
}
.tile-drop:hover { color: var(--accent); }
/* Крестик перекрывает счётчик, если не подвинуть содержимое плитки. */
.tile[data-on="1"] .tile-main { padding-right: 42px; }
.tile-drop:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tile[data-done="1"] .tile-count { color: var(--done); }

.tile-fixed { border-color: var(--line-strong); }

/* ─── Вопрос ─── */
.rail {
  height: 3px;
  background: var(--line);
  border-radius: 2px;
  margin: 22px 0 20px;
  overflow: hidden;
}
.rail i { display: block; height: 100%; background: var(--accent); transition: width .2s; }

.q-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.q-icon {
  flex: 0 0 34px;
  height: 34px;
  color: var(--accent);
}
.q-icon svg, .q-icon img { width: 34px; height: 34px; display: block; }
.q-icon img { border-radius: 5px; object-fit: cover; }
.q-section { margin-bottom: 6px; }
.q-ask {
  font-size: clamp(1.2rem, 1.05rem + .9vw, 1.5rem);
  font-weight: 600;
  letter-spacing: -.015em;
  line-height: 1.25;
  margin: 0 0 16px;
  text-wrap: balance;
}

.why {
  display: flex;
  gap: 12px;
  background: var(--accent-wash);
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 13px 15px;
  margin-bottom: 20px;
}
.why-sign {
  flex: 0 0 26px;
  height: 26px;
  color: var(--accent);
}
.why-sign svg { width: 26px; height: 26px; display: block; }
.why .eyebrow { display: block; margin-bottom: 4px; color: var(--accent); font-weight: 500; }
.why p { margin: 0; color: var(--ink); font-size: .94rem; }

.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
}
.opt:hover { border-color: var(--line-strong); }
.opt-mark {
  flex: 0 0 20px;
  height: 20px;
  border: 1.5px solid var(--line-strong);
  border-radius: 50%;
  position: relative;
}
.opt-multi .opt-mark { border-radius: 5px; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-wash); }
.opt[aria-pressed="true"] .opt-mark { background: var(--accent); border-color: var(--accent); }
.opt[aria-pressed="true"] .opt-mark::after {
  content: "";
  position: absolute;
  left: 6px; top: 2px;
  width: 5px; height: 10px;
  border: solid var(--accent-ink);
  border-width: 0 2px 2px 0;
  transform: rotate(42deg);
}

.field {
  width: 100%;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  font: inherit;
  color: inherit;
}
.field:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.field-label { display: block; margin-bottom: 6px; font-weight: 500; }
.own { margin-top: 10px; }
.own input {
  width: 100%;
  padding: 12px 14px;
  background: var(--surface-2);
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius);
  font: inherit;
  color: inherit;
}
.own input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.own input:not(:placeholder-shown) {
  border-style: solid;
  border-color: var(--accent);
  background: var(--surface);
}
.fields { display: flex; flex-direction: column; gap: 18px; }
.field-bad { border-color: var(--accent); }
.field-error {
  margin: 6px 0 0;
  color: var(--accent);
  font-size: .88rem;
}

.consent {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 14px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
}
.consent[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-wash); }
.consent-mark {
  flex: 0 0 20px;
  height: 20px;
  margin-top: 1px;
  border: 1.5px solid var(--line-strong);
  border-radius: 5px;
  position: relative;
}
.consent[aria-pressed="true"] .consent-mark {
  background: var(--accent);
  border-color: var(--accent);
}
.consent[aria-pressed="true"] .consent-mark::after {
  content: "";
  position: absolute;
  left: 6px; top: 2px;
  width: 5px; height: 10px;
  border: solid var(--accent-ink);
  border-width: 0 2px 2px 0;
  transform: rotate(42deg);
}
.consent-body { flex: 1; text-align: left; font-size: .94rem; }
.consent-full {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: .88rem;
  line-height: 1.55;
}

/* ─── Нижняя панель ─── */
.bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  z-index: 5;
}
.bar-in { max-width: 660px; margin: 0 auto; display: flex; gap: 10px; }

.btn {
  flex: 1;
  padding: 15px 18px;
  border-radius: var(--radius);
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn-main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-main:hover { filter: brightness(1.06); }
.btn-ghost { flex: 0 0 auto; background: none; border-color: transparent; color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .opt:focus-visible, .tile-main:focus-visible, .tile-open:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ─── Готовое задание ─── */
.brief {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 13px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-x: auto;
  margin-bottom: 16px;
}
.warn {
  background: var(--accent-wash);
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 16px;
  font-size: .94rem;
}
.warn p { margin: 0; }

.gap { height: 20px; }
.note-line { color: var(--muted); font-size: .9rem; margin: 14px 0 0; }
.linky {
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  color: var(--accent);
  text-decoration: underline;
  cursor: pointer;
}
.linky:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>

eom", "vk"]}}, {"id": "equipment_layout", "ask": "Есть ли расстановка технологического оборудования?", "brief": "Технологическая карта и спецификация оборудования", "type": "text", "weight": "blocker", "why": "На кухне ресторана и на производстве всё считается от оборудования: сколько тепла оно отдаёт, сколько потребляет воды и электричества, куда уходят стоки. Нужны марка и наименование каждой единицы, а не «примерно как обычно».", "hint": "Технологическая карта, план расстановки, спецификация с марками", "when": {"item": "building_type", "any_of": ["restaurant", "production", "shop", "bank", "service_point", "mall_unit"]}}, {"id": "wall_material", "ask": "Из чего стены?", "brief": "Материал стен", "type": "choice", "weight": "blocker", "why": "Материал стен - это теплопотери, а значит мощность отопления. Он же определяет, как вести проводку и крепить оборудование: в бетоне штробят, в деревянном доме кабель прокладывают иначе, и это меняет смету.", "options": [{"id": "concrete", "label": "Бетон"}, {"id": "aerated_block", "label": "Блоки ячеистого бетона"}, {"id": "brick", "label": "Кирпич"}, {"id": "wood", "label": "Дерево"}, {"id": "unknown", "label": "Не знаю"}], "unknown": "unknown"}, {"id": "floor_material", "ask": "Из чего перекрытия?", "brief": "Материал перекрытий", "type": "choice", "weight": "important", "why": "По перекрытиям идёт вся разводка. От материала зависит, можно ли залить тёплый пол в стяжку или придётся использовать настильную систему по дереву.", "options": [{"id": "concrete", "label": "Бетон"}, {"id": "wood", "label": "Дерево"}, {"id": "unknown", "label": "Не знаю"}], "unknown": "unknown"}, {"id": "extra_buildings", "ask": "Что ещё есть на участке или в доме?", "brief": "Дополнительные строения и сооружения", "type": "multi", "weight": "blocker", "why": "Каждое строение и бассейн - это отдельная нагрузка на тепло, воду и электричество. Забытый гараж или бассейн потом не вмещается в выделенную мощность.", "options": [{"id": "garage", "label": "Гараж"}, {"id": "guest_house", "label": "Гостевой дом"}, {"id": "guard_house", "label": "Дом охраны"}, {"id": "pool_outdoor", "label": "Бассейн отдельно стоящий"}, {"id": "pool_indoor", "label": "Бассейн внутри дома"}, {"id": "winter_garden", "label": "Зимний сад"}, {"id": "other", "label": "Иное"}, {"id": "unknown", "label": "Не знаю"}], "unknown": "unknown"}, {"id": "extra_buildings_in_scope", "ask": "Какие из них подключаем к проектируемым системам?", "brief": "Строения, включённые в проектирование", "type": "text", "weight": "blocker", "why": "Само по себе наличие гаража или бассейна ещё не значит, что мы их проектируем. Гараж может остаться холодным и без воды, а бассейн - вообще уйти к другому подрядчику. Пока не сказано прямо, что входит в работу, объём проекта и цена посчитаны наугад.", "hint": "Например: гараж отапливаем, бассейн не наш", "when": {"item": "extra_buildings", "not_empty": true}}, {"id": "boiler_room_location", "ask": "Котельная внутри дома или отдельным строением?", "brief": "Размещение котельной", "type": "choice", "weight": "important", "why": "Отдельно стоящая котельная требует теплотрассы до дома и своего электропитания. Встроенная - вентиляции, дымохода и площади помещения по нормам. Выбор меняет и планировку, и бюджет.", "options": [{"id": "inside", "label": "Внутри дома"}, {"id": "separate", "label": "Отдельное сооружение"}, {"id": "unknown", "label": "Не знаю"}], "unknown": "unknown", "when": {"item": "scope_sections", "contains": "tm"}}, {"id": "low_temp_rooms", "ask": "Какие помещения топим меньше остальных?", "brief": "Помещения с пониженной температурой", "type": "multi", "weight": "detail", "why": "Помещения, которые топят слабее, считаются отдельно. Без этого их посчитают как жилые: лишняя мощность и лишние приборы отопления.", "options": [{"id": "garage", "label": "Гараж"}, {"id": "storage", "label": "Кладовая, хозблок"}, {"id": "hall", "label": "Тамбур, прихожая"}, {"id": "basement", "label": "Подвал, цоколь"}, {"id": "guest" ное"}, {"id": "water_floor", "label": "Водяные тёплые полы"}, {"id": "electric_floor", "label": "Электрические тёплые полы"}, {"id": "warm_walls", "label": "Тёплые стены, панельное отопление"}, {"id": "air", "label": "Воздушное отопление"}, {"id": "unknown", "label": "Не знаю"}], "unknown": "unknown"}, {"id": "radiator_type", "ask": "Радиаторы обычные или дизайнерские?", "brief": "Тип отопительных приборов", "type": "choice", "weight": "detail", "why": "Тип радиатора меняет цену и отдачу тепла. Дизайнерские модели и встроенные в пол конвекторы обычно отдают меньше тепла на тот же размер, поэтому их нужно больше.", "options": [{"id": "panel", "label": "Панельные"}, {"id": "design", "label": "Дизайн-радиаторы"}, {"id": "cast_iron", "label": "Секционные чугунные"}, {"id": "aluminium", "label": "Секционные алюминиевые"}, {"id": "bimetal", "label": "Секционные биметаллические"}, {"id": "floor_convector", "label": "Конвекторы, встроенные в пол"}, {"id": "unknown", "label": "Не знаю"}], "unknown": "unknown", "when": {"item": "heating_kind", "contains": "radiators"}}, {"id": "radiator_placement", "ask": "Радиаторы на виду, в нишах или закрыть экраном?", "brief": "Размещение отопительных приборов", "type": "choice", "weight": "detail", "why": "Ниша и декоративный экран запирают часть тепла: оно уходит в стену, а не в комнату. Это закладывается запасом мощности, поэтому решение нужно знать до расчёта, а не после.", "options": [{"id": "niche", "label": "В нишах стен"}, {"id": "open", "label": "Открыто"}, {"id": "niche_screen", "label": "В нишах, закрыть декоративным экраном"}, {"id": "unknown", "label": "Не знаю"}], "unknown": "unknown", "when": {"item": "heating_kind", "contains": "radiators"}}, {"id": "unheated_rooms", "ask": "Какие помещения не отапливаем вовсе?", "brief": "Неотапливаемые помещения", "type": "multi", "weight": "important", "why": "Неотапливаемые помещения выпадают из расчёта мощности, но граничат с тёплыми, и через эту границу тепло уходит. Их надо знать, чтобы не занизить и не завысить котёл.", "options": [{"id": "garage", "label": "Гараж"}, {"id": "basement", "label": "Подвал, цоколь"}, {"id": "attic", "label": "Чердак"}, {"id": "terrace", "label": "Терраса, веранда"}, {"id": "storage", "label": "Хозблок, сарай"}, {"id": "none", "label": "Отапливаем всё"}, {"id": "unknown", "label": "Не знаю"}], "unknown": "unknown"}, {"id": "warm_floor_rooms", "ask": "В каких комнатах нужны тёплые полы?", "brief": "Помещения с тёплыми полами", "type": "multi", "weight": "important", "why": "Перечень комнат задаёт длину контуров и число коллекторов. После того как стяжка залита, добавить комнату уже нельзя.", "options": [{"id": "bath", "label": "Санузлы и ванные"}, {"id": "kitchen", "label": "Кухня"}, {"id": "hall", "label": "Прихожая, холл"}, {"id": "living", "label": "Гостиная"}, {"id": "bedrooms", "label": "Спальни"}, {"id": "wardrobe", "label": "Гардеробная"}, {"id": "all", "label": "Весь дом"}, {"id": "unknown", "label": "Не знаю"}], "unknown": "unknown", "when": {"item": "heating_kind", "contains": "water_floor"}}, {"id": "path_heating", "ask": "Нужен подогрев дорожек на улице, чтобы не обледеневали?", "brief": "Подогрев дорожек", "type": "bool", "weight": "important", "why": "Подогрев дорожек - это отдельный контур и заметная дополнительная мощность. Кабель уходит под покрытие, поэтому его закладывают в проект, а не докупают потом.", "unknown": "unknown"}, {"id": "path_heating_area", "ask": "Какая площадь подогрева нужна?", "brief": "Площадь подогрева дорожек", "type": "choice", "weight": "detail", "why": "Площадь подогрева прямо переводится в киловатты. От неё зависит, хватит ли выделенной на дом мощности.", "options": [{"id": "s20", "label": "До 20 кв.м"}, {"id": "s50", "label": "От 20 до 50 кв.м"}, {"id": "s100", "label": "От 50 до 100 кв.м"}, {"id": "s100p", "label": "Больше 100 кв.м"}, {"id": "unknown", "label": "Пока не знаю"}], "unknown": "unknown", "when": {"item": "path_heating", "equals": true}}, {"id": "towel_dryer ое топливо"}, {"id": "fuel_oil", "label": "Мазут"}, {"id": "wood", "label": "Дрова"}, {"id": "coal", "label": "Уголь"}, {"id": "pellets", "label": "Пеллеты"}, {"id": "electricity", "label": "Электроэнергия"}, {"id": "unknown", "label": "Не знаю"}], "unknown": "unknown"}, {"id": "fuel_reserve", "ask": "Нужно ли резервное топливо на случай отключения?", "brief": "Резервное топливо", "type": "choice", "weight": "important", "why": "Резервное топливо позволяет топить дом, когда основное недоступно. Это либо второй котёл, либо комбинированная горелка, и место под них закладывают сразу.", "options": [{"id": "gas_main", "label": "Магистральный газ"}, {"id": "gas_lpg", "label": "Сжиженный газ"}, {"id": "diesel", "label": "Дизельное топливо"}, {"id": "fuel_oil", "label": "Мазут"}, {"id": "wood", "label": "Дрова"}, {"id": "coal", "label": "Уголь"}, {"id": "pellets", "label": "Пеллеты"}, {"id": "electricity", "label": "Электроэнергия"}, {"id": "none", "label": "Резерв не нужен"}, {"id": "unknown", "label": "Не знаю"}], "unknown": "unknown"}, {"id": "boiler_reserve", "ask": "Нужен ли резервный котёл?", "brief": "Резервный котёл", "type": "choice", "weight": "important", "why": "Резервный котёл включается, когда основной остановился. Он занимает место в котельной и требует своего подключения к дымоходу, поэтому решается до планировки помещения.", "options": [{"id": "solid_fuel", "label": "Твердотопливный"}, {"id": "gas", "label": "Газовый"}, {"id": "electric", "label": "Электрический"}, {"id": "none", "label": "Не нужен"}, {"id": "unknown", "label": "Не знаю"}], "unknown": "unknown"}, {"id": "flue_position", "ask": "Дымоход вести внутри дома или снаружи по фасаду?", "brief": "Прокладка дымохода", "type": "choice", "weight": "detail", "why": "Внутренний дымоход не виден снаружи и меньше остывает, наружный не занимает места в доме и проще в монтаже. Это вопрос и внешнего вида дома, и площади помещений.", "options": [{"id": "internal", "label": "Внутренний"}, {"id": "external", "la Существующая"}, {"id": "to_drill", "label": "Требуется бурение"}, {"id": "unknown", "label": "Не знаю"}], "unknown": "unknown", "when": {"item": "water_source", "contains": "well"}}, {"id": "leak_control", "ask": "Нужна ли защита от протечек и какая?", "brief": "Защита от протечек", "type": "choice", "weight": "important", "why": "Система перекрывает воду при протечке. Магистральная закрывает весь дом, местная - только один участок. Краны и датчики ставят в конкретных точках, поэтому решают до разводки труб.", "options": [{"id": "main_shutoff", "label": "Магистральное отключение воды"}, {"id": "local_shutoff", "label": "Местное отключение воды"}, {"id": "none", "label": "Не требуется"}, {"id": "unknown", "label": "Не знаю"}], "unknown": "unknown"}, {"id": "water_treatment", "ask": "Нужна ли система очистки воды?", "brief": "Водоподготовка", "type": "choice", "weight": "important", "why": "Очистка подбирается под вашу воду и занимает место в помещении. Если её не заложить сразу, потом придётся искать, куда поставить оборудование, и переделывать разводку.", "options": [{"id": "needed", "label": "Требуется"}, {"id": "not_needed", "label": "Не требуется"}, {"id": "installed", "label": "Уже установлена"}, {"id": "unknown", "label": "Не знаю"}], "unknown": "unknown"}, {"id": "water_analysis", "ask": "Делали химический анализ воды?", "brief": "Химический анализ воды", "type": "bool", "weight": "important", "why": "Фильтры подбирают по составу воды, а состав показывает только анализ. Сам анализ стоит несопоставимо дешевле, чем замена неподходящей системы очистки.", "unknown": "unknown", "when": {"item": "water_treatment", "equals": "needed"}}, {"id": "summer_water", "ask": "Нужен ли летний водопровод на улице?", "brief": "Летний водопровод", "type": "bool", "weight": "detail", "why": "Летний водопровод на зиму отключается и опорожняется, поэтому его ведут отдельной веткой со своим краном. Добавить её потом - это раскопки по благоустроенному участку.", "unknown": "unknown"}, {"id": "extra_water_points", "ask": "Что из этого будет в доме или на участке?", "brief": "Дополнительные точки водоразбора", "type": "multi", "weight": "important", "why": "Каждая такая точка добавляет расход воды в час пик. От суммы зависят диаметр труб, объём бойлера и производительность насоса.", "options": [{"id": "sauna", "label": "Сауна"}, {"id": "jacuzzi", "label": "Джакузи"}, {"id": "rain_shower", "label": "Тропический душ"}, {"id": "pool", "label": "Бассейн"}, {"id": "auto_watering", "label": "Автополив"}, {"id": "garden_taps", "label": "Поливочные краны"}, {"id": "unknown", "label": "Не знаю"}], "unknown": "unknown"}]}, {"id": "sewage", "title": "Канализация. Раздел ВК и НВК", "items": [{"id": "sewage_outlet", "ask": "Куда уходят стоки?", "brief": "Отвод хозяйственно-бытовых стоков", "type": "choice", "weight": "blocker", "why": "Способ отвода стоков определяет уклоны, глубину заложения труб и место выпуска. Автономная станция дополнительно требует электричества и места на участке.", "options": [{"id": "village_central", "label": "Централизованная канализация посёлка"}, {"id": "city_central", "label": "Городская канализация"}, {"id": "local_treatment", "label": "Автономная система на участке, ЛОС"}, {"id": "deep_bio", "label": "Станция глубокой биологической очистки"}, {"id": "unknown", "label": "Не знаю"}], "unknown": "unknown"}, {"id": "storm_sewage", "ask": "Собирать ли дождевую воду с кровли и участка?", "brief": "Ливневая канализация", "type": "bool", "weight": "important", "why": "Ливневая канализация уводит воду с кровли и участка от фундамента. Её трассы прокладывают вместе с остальными, пока участок не благоустроен.", "unknown": "unknown"}]}], "count": 10}, {"id": "eom", "label": "Электроснабжение", "short": "Электроснабжение", "icon": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 12h24v28H12z\"/><path d=\"M12 22h24\"/>< /* ─── Сохранение хода ────────────────────────────────────────────
   Контакты не сохраняем никогда: имя и телефон заказчика не должны
   оставаться в браузере, с которого опрос могут пройти повторно. */
function save() {
  if (!D.saveProgress) return;
  try {
    localStorage.setItem(KEY, JSON.stringify({picked: S.picked, answers: S.answers, own: S.own}));
  } catch (e) { /* приватный режим браузера - просто не сохраняем */ }
}
function restore() {
  if (!D.saveProgress) return;
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const v = JSON.parse(raw);
    if (v && v.answers) { S.picked = v.picked || []; S.answers = v.answers; S.own = v.own || {}; }
  } catch (e) { /* битое сохранение игнорируем */ }
}
function forget() {
  try { localStorage.removeItem(KEY); } catch (e) {}
}

/* ─── Условия показа пункта ─── */
function answerOf(id) {
  if (id === "scope_sections") return S.picked;
  return S.answers[id];
}
function visible(item) {
  const w = item.when;
  if (!w) return true;
  const a = answerOf(w.item);
  if (a === undefined || a === null || a === "") return false;
  if (Array.isArray(a) && a.length === 0) return false;
  if ("contains" in w) {
    const list = Array.isArray(a) ? a : [a];
    return list.some(v => String(v).indexOf(w.contains) !== -1);
  }
  // any_of - тот же смысл, что contains, но вариантов несколько:
  // техкарта нужна и ресторану, и производству, и магазину.
  if ("any_of" in w) {
    const list = Array.isArray(a) ? a : [a];
    return w.any_of.some(x => list.indexOf(x) !== -1);
  }
  // not_empty - показать, как только на предыдущий вопрос вообще
  // ответили: пустой ответ отсечён двумя проверками выше.
  if ("not_empty" in w) return true;
  if ("equals" in w) return a === w.equals;
  return true;
}

function iconOf(id) {
  if (id === "common") return D.commonIcon;
  const b = D.blocks.find(b => b.id === id);
  return b ? b.icon : "";
}
function blockSections(id) {
  if (id === "common") return D.common;
  const b = D.blocks.find(b => b.id === id);
  return b ? b.sections : [];
}
/* Плоский список вопросов плитки: раздел, вопрос, раздел, вопрос.
   Пересчитывается каждый раз - ответ может открыть новый вопрос. */
function questions(id) {
  const out = [];
  blockSections(id).forEach(sec => {
    sec.items.filter(visible).forEach(it => out.push({sec: sec, item: it}));
  });
  return out;
}
function answered(id) {
  return questions(id).filter(q => hasAnswer(q.item.id)).length;
}
// Пункт закрыт и тогда, когда человек вписал своё: варианты не

function hasAnswer(id) {

function isUnknown(v) {
  if (Array.isArray(v)) return v.length === 1 && v[0] === D.unknownId;

}
function filled(v) {
  if (v === undefined || v === null) return false;
  if (Array.isArray(v)) return v.length > 0;
  return String(v).trim() !== "";

let keepScroll = false;

function drawQuiz() {
  const keepY = keepScroll ? window.pageYOffset : 0;
  const list = questions(S.block);
  if (!list.length) { S.screen = "hub"; return draw(); }
  if (S.pos >= list.length) S.pos = list.length - 1;
  if (S.pos < 0) S.pos = 0;
  const q = list[S.pos];
  const it = q.item;
  const val = S.answers[it.id];

  let html = '<div class="rail"><i style="width:' +
    Math.round((S.pos + 1) / list.length * 100) + '%"></i></div>';
  html += '<div class="q-head"><span class="q-icon">' + iconOf(S.block) + '</span>' +
    '<span class="q-section eyebrow">' + esc(q.sec.title) + " · " +
    (S.pos + 1) + " / " + list.length + '</span></div>';
  html += '<h2 class="q-ask">' + esc(it.ask) + '</h2>';
  if (it.why) {
    html += '<div class="why"><span class="why-sign">' + SIGN + '</span><div>' +
      '<span class="eyebrow">' + esc(D.text.whyLabel) + '</span>' +
      '<p>' + esc(it.why) + '</p></div></div>';
  }

  if (it.type === "choice" || it.type === "multi" || it.type === "bool") {
    const opts = it.type === "bool"
      ? [{id: "yes", label: "Да"}, {id: "no", label: "Нет"},
         {id: D.unknownId, label: D.text.unknownLabel}]
      : it.options || [];
    const multi = it.type === "multi";
    // Ответ «да» хранится как true, а не как строка: условия показа в
    // опроснике записаны через equals: true, и строка им не равна.
    const cur = it.type === "bool"
      ? (val === true ? "yes" : val === false ? "no" : val === D.unknownId ? D.unknownId : null)
      : val;
    const chosen = multi ? (Array.isArray(val) ? val : []) : [cur];
    html += '<div class="opts">';
    opts.forEach(o => {
      const on = chosen.indexOf(o.id) !== -1;
      html += '<button class="opt' + (multi ? " opt-multi" : "") + '" aria-pressed="' + on +
        '" data-opt="' + esc(o.id) + '"><span class="opt-mark"></span>' +

  if (free) {
    free.addEventListener("input", () => { S.answers[it.id] = free.value; save(); });

  }
  const own = document.getElementById("own");
  if (own) own.addEventListener("input", () => { S.own[it.id] = own.value; save(); });
  hintsFade(app());

  const last = S.pos === list.length - 1;
  setBar('<button class="btn" data-act="prev">Назад</button>' +
    '<button class="btn btn-main" data-act="next">' +
    (last ? esc(D.text.toHub) : "Дальше") + '</button>');

/* ─── Проверка полей ─────────────────────────────────────────────

/* ─── Сборка технического задания ─── */
function labelOf(item, value) {
  if (item.type === "bool") {
    if (value === D.unknownId) return D.text.unknownLabel.toLowerCase();
    return value === true ? "да" : "нет";
  }
  if (!item.options) return String(value);
  const list = Array.isArray(value) ? value : [value];
  return list.map(v => {
    const o = item.options.find(o => o.id === v);
    return o ? o.label : v;
  }).join(", ");
}

function briefText() {

  // инженер читает задание сверху вниз и ждёт привычной последовательности.
  const order = ["common"].concat(D.blocks.map(b => b.id).filter(id => S.picked.indexOf(id) !== -1));
  const gaps = [];
  order.forEach(id => {
    const list = questions(id);
    if (!list.length) return;
    let head = null;
    list.forEach(q => {
      const v = S.answers[q.item.id];
      const o = S.own[q.item.id];
      if (!filled(v) && !filled(o)) { gaps.push(q.item.brief); return; }
      // «Не знаю» - честный ответ, но проектировать по нему нельзя:
      // пункт уходит в открытые с пометкой, что его уже спрашивали.
      if (isUnknown(v) && !filled(o)) {
        gaps.push(q.item.brief + " - заказчик не знает");
        return;
      }
      let value = filled(v) ? labelOf(q.item, v) : "";
      if (filled(o)) value = value ? value + ", " + o : o;
      if (head !== q.sec.id) {
        L.push("");
        L.push(q.sec.title.toUpperCase());
        head = q.sec.id;
      }
      L.push("- " + q.item.brief + ": " + value);
    });
  });

  if (gaps.length) {
    L.push("");
    L.push(D.text.gapsTitle.toUpperCase());
    gaps.forEach(g => L.push("- " + g));
  }
  return L.join("\n");
}

function drawResult() {
  const text = briefText();
  // Потолок сообщения в Telegram - 4096 символов. Длинное задание
  // ссылкой не уедет, поэтому отправку подменяем копированием.
  const tooLong = text.length > D.textLimit;
  // t.me/share ждёт два параметра: адрес и подпись к нему. С одним
  // параметром площадка отвечает 404 - проверено автором 2026-08-26.
  const link = "https://t.me/share/url?url=" + encodeURIComponent(D.text.shareUrl) +
    "&text=" + encodeURIComponent(text);

  let html = '<div class="head"><span class="eyebrow">Готово</span>' +
    '<h1>' + esc(D.text.resultTitle) + '</h1>' +
    '<p>' + esc(tooLong ? D.text.resultIntroLong : D.text.resultIntro) + '</p></div>';
  if (tooLong) {
    html += '<div class="warn"><p>' + esc(D.text.tooLong) + '</p></div>';
  }
  html += '<div class="brief" id="brief-text">' + esc(text) + '</div>';
  html += '<p class="note-line">' + text.length + ' символов</p>';
  html += '<p class="note-line">' + esc(D.text.resultHint) + '</p>';
  app().innerHTML = html;

  // Копирование - главное действие: оно работает в любом браузере и
  // ни от чего не зависит. Ссылка на Telegram рядом, второй кнопкой.
  setBar('<button class="btn btn-main" data-act="copy">' + esc(D.text.copy) + '</button>' +
    (tooLong ? "" :
      '<a class="btn" style="text-align:center;text-decoration:none" ' +
      'href="' + esc(link) + '" target="_blank" rel="noopener">' +
      esc(D.text.openTelegram) + '</a>'));
  window.scrollTo(0, 0);
}

/* ─── Переключение экранов ─── */
function draw() {
  if (S.screen === "hub") return drawHub();
  if (S.screen === "quiz") return drawQuiz();
  if (S.screen === "contacts") return drawContacts();
  return drawResult();
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-drop],[data-open],[data-opt],[data-by],[data-act]");
  if (!t) return;

  if (t.dataset.drop) {
    const id = t.dataset.drop;
    S.picked = S.picked.filter(x => x !== id);
    save(); return draw();
  }
  if (t.dataset.open) {
    const id = t.dataset.open;
    if (id !== "common" && S.picked.indexOf(id) === -1) S.picked.push(id);
    S.block = id; S.pos = 0; S.screen = "quiz";
    save(); return draw();
  }
  if (t.dataset.opt) {
    const list = questions(S.block);
    const it = list[S.pos].item;
    const raw = t.dataset.opt;
    const v = it.type === "bool" && raw !== D.unknownId ? raw === "yes" : raw;
    if (it.type === "multi") {
      let cur = Array.isArray(S.answers[it.id]) ? S.answers[it.id].slice() : [];
      const i = cur.indexOf(v);
      if (i !== -1) cur.splice(i, 1);
      else if (v === D.unknownId) cur = [v];          // «не знаю» вместо всего
      else cur = cur.filter(x => x !== D.unknownId).concat(v);
      S.answers[it.id] = cur;
      keepScroll = true;                              // остаёмся на месте
      save(); return draw();
    }
    S.answers[it.id] = S.answers[it.id] === v ? undefined : v;
    save();
    // Один вариант - вопрос закрыт, листаем дальше сами: менеджеру на
    // звонке лишнее нажатие стоит паузы в разговоре.
    if (S.answers[it.id] !== undefined && S.pos < questions(S.block).length - 1) S.pos++;
    else keepScroll = true;                           // вопрос не сменился
    return draw();
  }
  if (t.dataset.by) { S.contacts._by = t.dataset.by; return draw(); }

  const act = t.dataset.act;
  if (act === "prev") {
    if (S.pos === 0) { S.screen = "hub"; } else { S.pos--; }
    return draw();
  }
  if (act === "next") {
    if (S.pos >= questions(S.block).length - 1) { S.screen = "hub"; }
    else { S.pos++; }
    return draw();
  }
  if (act === "to-hub") { S.screen = "hub"; return draw(); }
  if (act === "to-contacts") { S.screen = "contacts"; return draw(); }
  if (act === "consent") { S.consent = !S.consent; return draw(); }
  if (act === "consent-more") { S.consentOpen = !S.consentOpen; return draw(); }
  if (act === "build") {
    if (Object.keys(contactErrors()).length || !S.consent) {
      S.showErrors = true;
      return draw();
    }
    S.screen = "result";
    return draw();
  }
  if (act === "copy") {
    const text = document.getElementById("brief-text").textContent;
    navigator.clipboard.writeText(text).then(
      () => { t.textContent = D.text.copied; },
      () => { t.textContent = D.text.copyFailed; }
    );
    return;
  }
  if (act === "reset") {
    if (!confirm(D.text.resetAsk)) return;
    S = EMPTY();
    forget(); return draw();
  }
});

restore();
draw();

</script>
